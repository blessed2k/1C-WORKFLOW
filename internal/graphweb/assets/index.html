<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта объектного графа</title>
<style>
  :root {
    --bg: #1b1e23;
    --panel: #22262c;
    --border: #363c44;
    --text: #d7dbe0;
    --muted: #8b929c;
    --accent: #4da3ff;
    --warn: #e0a72e;
    --danger: #e05a4e;
    --stale: #b085f5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; }
  header label { color: var(--muted); font-size: 12px; }
  header input[type=number], header input[type=text], header select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px; font: inherit;
  }
  button {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.active { border-color: var(--accent); color: var(--accent); }
  #filters {
    display: flex; align-items: center; gap: 10px; padding: 6px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    flex-wrap: wrap; font-size: 12px;
  }
  #filters .kind { display: flex; align-items: center; gap: 4px; }
  #filters .kind .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #main { flex: 1; display: flex; min-height: 0; }
  #cy { flex: 1; min-width: 0; background: var(--bg); }
  #side {
    width: 340px; flex: none; border-left: 1px solid var(--border);
    background: var(--panel); overflow-y: auto; padding: 10px;
    display: flex; flex-direction: column; gap: 14px;
  }
  #side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  #side section { border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  #side section:last-child { border-bottom: none; }
  .badge-row { display: flex; align-items: flex-start; gap: 6px; margin: 4px 0; font-size: 12px; }
  .badge-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex: none; }
  .badge-dot.has-dynamic { background: var(--warn); }
  .badge-dot.attribution-truncated { background: var(--danger); }
  .badge-dot.attribution-stale { background: var(--stale); }
  table.godnodes { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.godnodes th, table.godnodes td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--border); }
  table.godnodes tr.clickable { cursor: pointer; }
  table.godnodes tr.clickable:hover { background: rgba(77,163,255,.12); }
  .muted { color: var(--muted); }
  .evidence-chain-step { border-left: 2px solid var(--border); padding-left: 8px; margin: 6px 0; font-size: 12px; }
  #status { font-size: 12px; color: var(--muted); padding: 4px 12px; }
  #status.error { color: var(--danger); }
  .more-btn { margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Объектный граф</h1>
  <label>Проект <select id="project"></select></label>
  <label>Узел <input id="nodeId" type="number" min="1" placeholder="id объекта"></label>
  <button id="openBtn">Открыть</button>
  <button id="godBtn">God-node</button>
  <button id="resetBtn">Очистить карту</button>
</header>
<div id="filters">
  <span class="muted">Рёбра:</span>
  <label class="kind"><span class="swatch" style="background:#4da3ff"></span><input type="checkbox" data-kind="writes-register" checked> writes-register</label>
  <label class="kind"><span class="swatch" style="background:#5bd67d"></span><input type="checkbox" data-kind="reads-register" checked> reads-register</label>
  <label class="kind"><span class="swatch" style="background:#e0a72e"></span><input type="checkbox" data-kind="writes-declared" checked> writes-declared</label>
  <label class="kind"><span class="swatch" style="background:#b085f5"></span><input type="checkbox" data-kind="reads-query" checked> reads-query</label>
  <span class="muted" style="margin-left:12px;">confidence &ge;</span>
  <input id="minConfidence" type="range" min="0" max="1" step="0.05" value="0">
  <span id="minConfidenceLabel">0.00</span>
</div>
<div id="status"></div>
<div id="main">
  <div id="cy"></div>
  <div id="side">
    <section id="nodePanel">
      <h2>Узел</h2>
      <div class="muted">Кликните узел, чтобы увидеть карточку и раскрыть соседей.</div>
    </section>
    <section id="edgePanel" hidden>
      <h2>Evidence ребра</h2>
      <div id="edgeContent"></div>
    </section>
    <section id="godPanel" hidden>
      <h2>God-node</h2>
      <div>
        <button id="godFanIn" class="active">fan-in</button>
        <button id="godFanOut">fan-out</button>
      </div>
      <table class="godnodes"><thead><tr><th>Объект</th><th>fan-in</th><th>fan-out</th></tr></thead><tbody id="godBody"></tbody></table>
    </section>
  </div>
</div>
<script src="/assets/cytoscape.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
